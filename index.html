<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Memos organizados por provincia con transcripción y versionado">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/memo.svg" type="image/svg+xml">
    <title>Memos Jota Be</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden p-6">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h1 class="text-xl font-bold text-gray-800">📝 Memos Jota Be</h1>
                <span id="appVersion" class="text-[10px] text-gray-500 font-semibold">Versión 1.1.0</span>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="compartirApp()" type="button" class="bg-indigo-600 text-white text-xs font-semibold px-2.5 py-2 rounded-lg hover:bg-indigo-700 transition flex items-center gap-1">🔗 Compartir</button>
                <button id="installButton" type="button" class="hidden bg-gray-800 text-white text-xs font-semibold px-2.5 py-2 rounded-lg hover:bg-gray-900 transition">Instalar</button>
            </div>
        </div>

        <form id="memoForm" class="space-y-4">
            <input type="hidden" id="memoId">
            <div>
                <label class="block text-gray-700 font-semibold mb-1 text-sm">Provincia</label>
                <select id="provincia" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <option value="">Seleccionar provincia...</option>
                    <option value="Corrientes">Corrientes</option>
                    <option value="Chaco">Chaco</option>
                    <option value="Misiones">Misiones</option>
                    <option value="Formosa">Formosa</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1 text-sm">Título / Asunto</label>
                <input type="text" id="titulo" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: Control de stock" required>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-gray-700 font-semibold text-sm">Contenido del Memo</label>
                    <button type="button" id="btnTranscribir" onclick="toggleTranscripcion()" class="bg-purple-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg hover:bg-purple-700 transition">🎙️ Transcribir por Voz</button>
                </div>
                <span id="estadoTranscripcion" class="block text-xs text-purple-600 font-medium mb-1"></span>
                <textarea id="contenido" rows="4" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Escribí los detalles o usá la transcripción por voz..." required></textarea>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="submit" id="btnGuardar" class="flex-1 bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition shadow">Guardar Memo</button>
                <button type="button" id="btnCancelar" onclick="cancelarEdicion()" class="hidden bg-gray-400 text-white font-semibold px-4 py-2.5 rounded-lg hover:bg-gray-500 transition">Cancelar</button>
            </div>
        </form>

        <div class="mt-6 flex gap-2">
            <button onclick="exportarJSON()" class="flex-1 bg-emerald-600 text-white text-sm font-semibold py-2 rounded-lg hover:bg-emerald-700 transition">📥 Descargar JSON</button>
            <button onclick="exportarCSV()" class="flex-1 bg-teal-700 text-white text-sm font-semibold py-2 rounded-lg hover:bg-teal-800 transition">📊 Descargar CSV (Excel)</button>
        </div>

        <div class="mt-8">
            <h2 class="text-lg font-bold text-gray-800 mb-3">Memos Guardados</h2>
            <div id="listaMemos" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <script>
        const APP_VERSION = '1.1.0';
        let deferredInstallPrompt;
        const installButton = document.getElementById('installButton');
        let recognition = null;
        let isTranscribing = false;
        let baseTranscript = '';
        let processedFinalResults = new Set();

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installButton.classList.remove('hidden');
        });

        installButton.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            installButton.classList.add('hidden');
        });

        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));

        function compartirApp() {
            if (navigator.share) {
                navigator.share({ title: 'Memos Jota Be', text: 'Mirá la app de Memos por Provincia:', url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('¡Enlace de la app copiado al portapapeles!');
            }
        }

        function normalizarTexto(texto) {
            return texto.replace(/\s+/g, ' ').trim();
        }

        // Evita que SpeechRecognition agregue dos veces el mismo resultado final.
        function agregarTextoSinDuplicar(base, texto) {
            const nuevo = normalizarTexto(texto);
            const actual = normalizarTexto(base);
            if (!nuevo) return base;
            if (!actual || actual.toLowerCase().endsWith(nuevo.toLowerCase())) return actual ? actual + ' ' : nuevo + ' ';
            return actual + ' ' + nuevo + ' ';
        }

        function toggleTranscripcion() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Tu navegador no soporta transcripción de voz. Usá Google Chrome en el celular.');
                return;
            }
            const btn = document.getElementById('btnTranscribir');
            const estado = document.getElementById('estadoTranscripcion');
            const contenidoInput = document.getElementById('contenido');

            if (!isTranscribing) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-AR';
                recognition.interimResults = true;
                recognition.continuous = true;
                baseTranscript = contenidoInput.value ? contenidoInput.value.trim() + ' ' : '';
                processedFinalResults = new Set();

                recognition.onstart = () => {
                    isTranscribing = true;
                    btn.textContent = '⏹️ Detener Dictado';
                    btn.className = 'bg-red-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg hover:bg-red-700 transition';
                    estado.textContent = '🔴 Transcribiendo en vivo...';
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const texto = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            const clave = `${i}:${normalizarTexto(texto).toLowerCase()}`;
                            if (!processedFinalResults.has(clave)) {
                                baseTranscript = agregarTextoSinDuplicar(baseTranscript, texto);
                                processedFinalResults.add(clave);
                            }
                        } else {
                            interimTranscript += texto;
                        }
                    }
                    contenidoInput.value = baseTranscript + normalizarTexto(interimTranscript);
                };

                recognition.onerror = () => detenerTranscripcion();
                recognition.onend = () => detenerTranscripcion();
                recognition.start();
            } else {
                if (recognition) recognition.stop();
                detenerTranscripcion();
            }
        }

        function detenerTranscripcion() {
            isTranscribing = false;
            const btn = document.getElementById('btnTranscribir');
            const estado = document.getElementById('estadoTranscripcion');
            if (btn) {
                btn.textContent = '🎙️ Transcribir por Voz';
                btn.className = 'bg-purple-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg hover:bg-purple-700 transition';
            }
            if (estado) estado.textContent = '';
        }

        document.getElementById('memoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (isTranscribing && recognition) recognition.stop();
            const idInput = document.getElementById('memoId').value;
            const provincia = document.getElementById('provincia').value;
            const titulo = document.getElementById('titulo').value;
            const contenido = document.getElementById('contenido').value;
            const fechaActual = new Date().toLocaleString();
            let memos = JSON.parse(localStorage.getItem('memos')) || [];

            if (idInput) {
                memos = memos.map(m => m.id == idInput ? { ...m, provincia, titulo, contenido, version: (m.version || 1) + 1, fecha: `${fechaActual} (v${(m.version || 1) + 1})` } : m);
            } else {
                memos.unshift({ id: Date.now(), provincia, titulo, contenido, version: 1, fecha: `${fechaActual} (v1)` });
            }
            localStorage.setItem('memos', JSON.stringify(memos));
            cancelarEdicion();
            cargarMemos();
        });

        function cargarMemos() {
            const lista = document.getElementById('listaMemos');
            const memos = JSON.parse(localStorage.getItem('memos')) || [];
            if (!memos.length) {
                lista.innerHTML = '<p class="text-gray-400 text-center text-sm py-4">No hay memos cargados.</p>';
                return;
            }
            lista.innerHTML = '';
            memos.forEach(memo => {
                const div = document.createElement('div');
                div.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3 shadow-xs space-y-2';
                div.innerHTML = `<div class="flex justify-between items-center"><div class="flex gap-1.5 items-center"><span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded">${memo.provincia}</span><span class="bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded">v${memo.version || 1}</span></div><span class="text-[10px] text-gray-400">${memo.fecha}</span></div><h3 class="font-bold text-gray-800 text-sm">${memo.titulo}</h3><p class="text-gray-600 text-xs whitespace-pre-line">${memo.contenido}</p><div class="flex justify-between items-center pt-2 border-t border-gray-200"><button onclick="enviarWhatsApp('${memo.provincia}', '${encodeURIComponent(memo.titulo)}', '${encodeURIComponent(memo.contenido)}', ${memo.version || 1})" class="text-emerald-600 text-xs font-semibold hover:underline">💬 Enviar WhatsApp</button><div class="space-x-2"><button onclick="editarMemo(${memo.id})" class="text-blue-600 text-xs hover:underline">Editar</button><button onclick="eliminarMemo(${memo.id})" class="text-red-500 text-xs hover:underline">Eliminar</button></div></div>`;
                lista.appendChild(div);
            });
        }

        function editarMemo(id) {
            const memo = (JSON.parse(localStorage.getItem('memos')) || []).find(m => m.id === id);
            if (!memo) return;
            document.getElementById('memoId').value = memo.id;
            document.getElementById('provincia').value = memo.provincia;
            document.getElementById('titulo').value = memo.titulo;
            document.getElementById('contenido').value = memo.contenido;
            document.getElementById('btnGuardar').textContent = 'Actualizar Memo (v' + ((memo.version || 1) + 1) + ')';
            document.getElementById('btnCancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            if (isTranscribing && recognition) recognition.stop();
            document.getElementById('memoForm').reset();
            document.getElementById('memoId').value = '';
            document.getElementById('btnGuardar').textContent = 'Guardar Memo';
            document.getElementById('btnCancelar').classList.add('hidden');
        }

        function enviarWhatsApp(provincia, tituloEnc, contenidoEnc, version) {
            const texto = `*MEMO - ${provincia.toUpperCase()} (v${version})*\n*Asunto:* ${decodeURIComponent(tituloEnc)}\n\n${decodeURIComponent(contenidoEnc)}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
        }

        function eliminarMemo(id) {
            const memos = (JSON.parse(localStorage.getItem('memos')) || []).filter(m => m.id !== id);
            localStorage.setItem('memos', JSON.stringify(memos));
            cargarMemos();
        }

        function exportarJSON() {
            const blob = new Blob([localStorage.getItem('memos') || '[]'], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `memos_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportarCSV() {
            const memos = JSON.parse(localStorage.getItem('memos')) || [];
            if (!memos.length) { alert('No hay memos para exportar.'); return; }
            let csvContent = 'data:text/csv;charset=utf-8,ID,Provincia,Version,Titulo,Contenido,Fecha\n';
            memos.forEach(m => csvContent += `"${m.id}","${m.provincia}","${m.version || 1}","${m.titulo}","${m.contenido.replace(/[\n\r]+/g, ' ')}","${m.fecha}"\n`);
            const a = document.createElement('a');
            a.href = encodeURI(csvContent);
            a.download = `memos_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
        }

        document.getElementById('appVersion').textContent = `Versión ${APP_VERSION}`;
        cargarMemos();
    </script>
</body>
</html>
